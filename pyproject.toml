[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-test"
version = "0.3.0"
description = "基于 OpenAI Chat Completions 与 Pydantic v2 的模块化 ReAct Agent（uv 管理）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]