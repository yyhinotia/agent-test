[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "react-openai-agent"
version = "0.1.0"
description = "基于 OpenAI Chat Completions 与 Pydantic v2 的 ReAct Agent 脚手架"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
